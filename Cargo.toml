[workspace]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/DenisGorbachev/zapper-xyz-api"
keywords = []
categories = []
exclude = [
    ".*",
    "*.local.*",
    "doc/dev",
    "specs",
    "AGENTS.ts",
    "CargoMetadata.ts",
    "README.ts",
    "AGENTS*.md",
    "deno.lock",
    "deno.json",
    "clippy.toml",
    "commitlint.config.mjs",
    "fnox.toml",
    "mise.toml",
    "nu-lint.toml",
    "nufmt.nuon",
    "rumdl.toml",
    "shuck.toml",
    "rustfmt.toml",
    "rust-toolchain.toml",
    "skills-lock.json",
    ".yolobox"
]

[workspace.metadata.details]
name = "zapper-xyz-api"
title = "API client for zapper.xyz"
readme = { generate = true }

[workspace.lints.cargo]
unused_dependencies = "deny"

[workspace.lints.rust]
redundant_imports = "deny"
unused_import_braces = "deny"
# unused_qualifications must not be "deny" because our code style has multiple `use Foo::*;`, and some macros (derive_more::Display, strum::Display, strum::EnumString) produce code with full qualifications
# unused_qualifications = "deny"

[workspace.lints.clippy]
# Rust 1.100 reports redundant fields inside derive macros: https://github.com/rust-lang/rust-clippy/issues/17525.
redundant_field_names = "allow"
absolute_paths = "deny"
arithmetic_side_effects = "deny"

[package]
name = "zapper-xyz-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "An API client for zapper.xyz."
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[package.metadata.details]
title = "API client for zapper.xyz"

[lints]
workspace = true

[dependencies]
derive-new = "0.7"
derive_setters = "0.1"
graphql_client = { version = "0.16", features = ["graphql_query_derive"] }
errgonomic = "0.6.0"
governor = "0.10"
reqwest = { version = "0.13", features = ["json", "query"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
url-macro = "0.2"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "fs", "net"] }
non-empty-str = { version = "0.11", features = ["serde"] }
derive_more = { version = "2", default-features = false, features = ["as_ref", "display", "from", "into"] }
page-turner = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }

#derive-getters = { version = "0.5.0", features = ["auto_copy_getters"] }
#derive-new = "0.7.0"
#derive_more = { version = "2.1.1", features = ["full"] }
#errgonomic = { git = "https://github.com/DenisGorbachev/errgonomic" }
#itertools = "0.14.0"
#standard-traits = { git = "https://github.com/DenisGorbachev/standard-traits" }
#strum = { version = "0.27.2", features = ["derive"] }
#stub-macro = { version = "0.2.1" }
#subtype = { git = "https://github.com/DenisGorbachev/subtype" }

# Resolve apigen for AGENTS.md generation without compiling it.
[target.'cfg(false)'.dependencies]
apigen = { git = "https://github.com/DenisGorbachev/apigen" }
